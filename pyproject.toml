[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Provider-independent phishing detection system for emails"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PhishGuard Contributors"}
]
requires-python = ">=3.9"
keywords = ["phishing", "email", "security", "detection", "imap", "microsoft-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Email",
    "Topic :: Security",
]

dependencies = [
    "email-validator>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "dnspython>=2.4.0",
]

[project.optional-dependencies]
imap = [
    "imapclient>=3.0.0",
]
microsoft = [
    "azure-identity>=1.13.0",
    "msgraph-core>=0.2.0",
    "msgraph-sdk>=0.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pylint>=2.17.0",
]

[project.urls]
Homepage = "https://github.com/username/phishguard"
Documentation = "https://github.com/username/phishguard/wiki"
Repository = "https://github.com/username/phishguard.git"
"Bug Tracker" = "https://github.com/username/phishguard/issues"

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools]
packages = ["phishguard"]

[tool.setuptools.package-data]
phishguard = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=phishguard --cov-report=html --cov-report=term-missing"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.coverage.run]
source = ["phishguard"]
